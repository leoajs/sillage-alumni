<app-en-tete />

<main class="page-auth">
  <div class="fond" aria-hidden="true">
    <span class="tache tache-1"></span>
    <span class="tache tache-2"></span>
  </div>

  <form class="carte carte-auth" [formGroup]="formulaire" (ngSubmit)="creerCompte()">
    <h1>S'inscrire</h1>
    <p class="sous-titre">Rejoins le réseau des miagistes.</p>

    <div class="ligne-champs">
      <label class="champ">
        <span>Prénom</span>
        <input type="text" formControlName="prenom" autocomplete="given-name" />
        @if (champInvalide('prenom')) {
          <small class="erreur-champ">Le prénom est obligatoire.</small>
        }
      </label>
      <label class="champ">
        <span>Nom</span>
        <input type="text" formControlName="nom" autocomplete="family-name" />
        @if (champInvalide('nom')) {
          <small class="erreur-champ">Le nom est obligatoire.</small>
        }
      </label>
    </div>

    <label class="champ">
      <span>Email</span>
      <input type="email" formControlName="email" placeholder="prenom@exemple.fr" autocomplete="email" />
      @if (champInvalide('email')) {
        <small class="erreur-champ">Saisis une adresse email valide.</small>
      }
    </label>

    <label class="champ">
      <span>Mot de passe</span>
      <input type="password" formControlName="motDePasse" autocomplete="new-password" />
      @if (champInvalide('motDePasse')) {
        <small class="erreur-champ">6 caractères minimum.</small>
      }
    </label>

    <div class="ligne-champs">
      <label class="champ">
        <span>Ville <em>(facultatif)</em></span>
        <input type="text" formControlName="ville" placeholder="Paris" autocomplete="address-level2" />
      </label>
    </div>

    @if (erreur()) {
      <p class="message-erreur">{{ erreur() }}</p>
    }

    <button class="bouton bouton-plein bouton-large" type="submit" [disabled]="envoiEnCours()">
      {{ envoiEnCours() ? 'Création du compte…' : 'Créer mon compte' }}
    </button>

    <p class="bas-carte">Déjà membre ? <a routerLink="/connexion">Se connecter</a></p>
  </form>
</main>
