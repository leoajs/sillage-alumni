<article class="carte carte-sujet">
  <header class="auteur">
    <app-avatar [initiales]="initiales(sujet.auteurNom)" [teinte]="teinteAvatar(sujet.auteurId)" taille="petit" />
    <div>
      <p class="nom">{{ sujet.auteurNom }}@if (estMonSujet) { <span class="moi">(moi)</span>}</p>
      <p class="quand">{{ datePublication(sujet.createdAt) }}</p>
    </div>
    <span class="badge teinte-{{ teinte }}">{{ sujet.categorieLibelle }}</span>
  </header>

  <h3 class="titre">{{ sujet.titre }}</h3>
  <p class="extrait">{{ sujet.description }}</p>

  <footer class="pied">
    <button class="bouton-like" type="button" [class.aime]="sujet.likeParMoi" (click)="aimer.emit(sujet.id)" aria-label="J'aime">
      <svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z" /></svg>
      {{ sujet.nombreLikes }}
    </button>
    <a class="bouton bouton-doux" [routerLink]="['/forum', sujet.id]">Voir le post →</a>
  </footer>
</article>
